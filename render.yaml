# Render deployment for MR MUAVIA MD BOT (FREE tier).
#
# HOW 24/7 FREE HOSTING WORKS HERE:
# 1. Free web services SLEEP after ~15 minutes without incoming traffic.
#    => Add a free uptime monitor (UptimeRobot / cron-job.org) pinging
#       https://<your-service>.onrender.com/api/health every 10-14 minutes.
#       730 hrs/month of uptime fits inside the 750 free instance-hours.
# 2. The free tier has an EPHEMERAL filesystem: auth_info/ is WIPED on every
#    restart/redeploy. WhatsApp sessions therefore live in POSTGRES, not files.
#    => Create a FREE Neon Postgres database (neon.tech — no expiry, no credit
#       card, 0.5 GB free) and set its connection string as DATABASE_URL below.
#    => Users pair ONCE via pairing code on the dashboard; the session is saved
#       to the database automatically and restored on every restart.
#       NO session-ID copy-paste needed — the flow stays: number -> pairing code -> done.
#    => Do NOT use Render's own free Postgres here: it is DELETED 30 days after
#       creation, which would log everyone out monthly.
#
# NOTE: Vercel / Netlify / Cloudflare Workers CANNOT run this bot at all —
# they are serverless-only (no long-running process, no persistent WebSocket,
# no persistent filesystem), which Baileys requires.

services:
  - type: web
    name: mr-muavia-md-bot
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: node index.js
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        sync: false # Neon Postgres connection string (postgresql://...). Sessions persist here across restarts. KEEP SECRET.
      - key: OWNER_NUMBER
        sync: false # set in Render dashboard: your WhatsApp number, e.g. 923200799496
      - key: OWNER_DISPLAY_NUMBER
        sync: false
      - key: APP_URL
        sync: false # set after first deploy: https://<your-service>.onrender.com
      - key: COBALT_INSTANCES
        sync: false
